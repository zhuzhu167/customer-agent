name: customer-agent-production

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env.production
        required: false
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_NAME: "${APP_NAME:-customer-agent-backend}"
      API_PREFIX: "${API_PREFIX:-/api/v1}"
      BACKEND_CORS_ORIGINS: "${BACKEND_CORS_ORIGINS:?set BACKEND_CORS_ORIGINS}"
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL}"
      REDIS_URL: "${REDIS_URL:?set REDIS_URL}"
      LIVEKIT_URL: "${LIVEKIT_URL:?set LIVEKIT_URL}"
      PUBLIC_LIVEKIT_URL: "${PUBLIC_LIVEKIT_URL:-${LIVEKIT_URL:?set LIVEKIT_URL}}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}"
      LIVEKIT_TOKEN_TTL_SECONDS: "${LIVEKIT_TOKEN_TTL_SECONDS:-3600}"
      DEFAULT_ASR_PROVIDER: "${DEFAULT_ASR_PROVIDER:-tencent_cloud}"
      DEFAULT_TTS_PROVIDER: "${DEFAULT_TTS_PROVIDER:-tencent_cloud}"
      DEFAULT_LLM_PROVIDER: "${DEFAULT_LLM_PROVIDER:-alibaba_cloud}"
      TENCENT_CLOUD_REGION: "${TENCENT_CLOUD_REGION:-ap-guangzhou}"
      TENCENT_CLOUD_ASR_MODEL: "${TENCENT_CLOUD_ASR_MODEL:-16k_zh}"
      TENCENT_CLOUD_ASR_ENDPOINT: "${TENCENT_CLOUD_ASR_ENDPOINT:-asr.tencentcloudapi.com}"
      TENCENT_CLOUD_REALTIME_ASR_HOST: "${TENCENT_CLOUD_REALTIME_ASR_HOST:-asr.cloud.tencent.com}"
      TENCENT_CLOUD_REALTIME_ASR_ENGINE_MODEL_TYPE: "${TENCENT_CLOUD_REALTIME_ASR_ENGINE_MODEL_TYPE:-16k_zh}"
      TENCENT_CLOUD_REALTIME_ASR_VOICE_FORMAT: "${TENCENT_CLOUD_REALTIME_ASR_VOICE_FORMAT:-1}"
      TENCENT_CLOUD_REALTIME_ASR_FILTER_DIRTY: "${TENCENT_CLOUD_REALTIME_ASR_FILTER_DIRTY:-0}"
      TENCENT_CLOUD_REALTIME_ASR_FILTER_MODAL: "${TENCENT_CLOUD_REALTIME_ASR_FILTER_MODAL:-0}"
      TENCENT_CLOUD_REALTIME_ASR_FILTER_PUNC: "${TENCENT_CLOUD_REALTIME_ASR_FILTER_PUNC:-0}"
      TENCENT_CLOUD_REALTIME_ASR_CONVERT_NUM_MODE: "${TENCENT_CLOUD_REALTIME_ASR_CONVERT_NUM_MODE:-1}"
      TENCENT_CLOUD_TTS_ENDPOINT: "${TENCENT_CLOUD_TTS_ENDPOINT:-tts.tencentcloudapi.com}"
      TENCENT_CLOUD_TTS_VOICE: "${TENCENT_CLOUD_TTS_VOICE:-101001}"
      TENCENT_CLOUD_TTS_CODEC: "${TENCENT_CLOUD_TTS_CODEC:-wav}"
      TENCENT_CLOUD_TTS_SAMPLE_RATE: "${TENCENT_CLOUD_TTS_SAMPLE_RATE:-16000}"
      TENCENT_CLOUD_SECRET_REF: "${TENCENT_CLOUD_SECRET_REF:-env:TENCENT_CLOUD_SECRET_ID,TENCENT_CLOUD_SECRET_KEY}"
      TENCENT_CLOUD_SECRET_FILE: ""
      TENCENT_CLOUD_SECRET_ID: "${TENCENT_CLOUD_SECRET_ID:?set TENCENT_CLOUD_SECRET_ID}"
      TENCENT_CLOUD_SECRET_KEY: "${TENCENT_CLOUD_SECRET_KEY:?set TENCENT_CLOUD_SECRET_KEY}"
      TENCENT_CLOUD_APP_ID: "${TENCENT_CLOUD_APP_ID:-}"
      ALIBABA_CLOUD_REGION: "${ALIBABA_CLOUD_REGION:-cn-hangzhou}"
      ALIBABA_CLOUD_LLM_MODEL: "${ALIBABA_CLOUD_LLM_MODEL:-qwen-plus}"
      ALIBABA_CLOUD_ENDPOINT: "${ALIBABA_CLOUD_ENDPOINT:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      ALIBABA_CLOUD_SECRET_REF: "${ALIBABA_CLOUD_SECRET_REF:-env:ALIBABA_CLOUD_API_KEY}"
      ALIBABA_CLOUD_SECRET_FILE: ""
      ALIBABA_CLOUD_API_KEY: "${ALIBABA_CLOUD_API_KEY:?set ALIBABA_CLOUD_API_KEY}"
      SESSION_PERSIST_AUDIO: "false"
      REPLY_PREPARING_VISIBILITY: "${REPLY_PREPARING_VISIBILITY:-demo_debug_only}"
      ALLOW_TTS_TEXT_ONLY_FALLBACK: "false"
      AUTO_START_VOICE_WORKER: "${AUTO_START_VOICE_WORKER:-true}"
      TURN_LOW_CONFIDENCE_THRESHOLD: "${TURN_LOW_CONFIDENCE_THRESHOLD:-0.72}"
      VOICE_WORKER_LAUNCH_MODE: "${VOICE_WORKER_LAUNCH_MODE:-external}"
      VOICE_WORKER_ID: "${VOICE_WORKER_ID:-prod-api}"
      VOICE_WORKER_POLL_INTERVAL_SECONDS: "${VOICE_WORKER_POLL_INTERVAL_SECONDS:-1.0}"
      VOICE_WORKER_SESSION_POLL_SECONDS: "${VOICE_WORKER_SESSION_POLL_SECONDS:-1.0}"
      VOICE_WORKER_JOB_LEASE_SECONDS: "${VOICE_WORKER_JOB_LEASE_SECONDS:-120}"
      VOICE_WORKER_HEARTBEAT_INTERVAL_SECONDS: "${VOICE_WORKER_HEARTBEAT_INTERVAL_SECONDS:-15.0}"
      VOICE_WORKER_MAX_ATTEMPTS: "${VOICE_WORKER_MAX_ATTEMPTS:-3}"
      TURN_SILENCE_TIMEOUT_SECONDS: "${TURN_SILENCE_TIMEOUT_SECONDS:-12.0}"
      TURN_SILENCE_CHECK_INTERVAL_SECONDS: "${TURN_SILENCE_CHECK_INTERVAL_SECONDS:-1.0}"
      TURN_BARGE_IN_RMS_THRESHOLD: "${TURN_BARGE_IN_RMS_THRESHOLD:-0.018}"
      TURN_BARGE_IN_MIN_VOICE_FRAMES: "${TURN_BARGE_IN_MIN_VOICE_FRAMES:-2}"
      TURN_INTERRUPTION_RECOVERY_TIMEOUT_SECONDS: "${TURN_INTERRUPTION_RECOVERY_TIMEOUT_SECONDS:-2.5}"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command:
      - "sh"
      - "-c"
      - "python -m backend.app.worker.runtime_config_check && alembic -c backend/alembic.ini upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  voice-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env.production
        required: false
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_NAME: "${APP_NAME:-customer-agent-backend}"
      API_PREFIX: "${API_PREFIX:-/api/v1}"
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL}"
      REDIS_URL: "${REDIS_URL:?set REDIS_URL}"
      LIVEKIT_URL: "${LIVEKIT_URL:?set LIVEKIT_URL}"
      PUBLIC_LIVEKIT_URL: "${PUBLIC_LIVEKIT_URL:-${LIVEKIT_URL:?set LIVEKIT_URL}}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}"
      DEFAULT_ASR_PROVIDER: "${DEFAULT_ASR_PROVIDER:-tencent_cloud}"
      DEFAULT_TTS_PROVIDER: "${DEFAULT_TTS_PROVIDER:-tencent_cloud}"
      DEFAULT_LLM_PROVIDER: "${DEFAULT_LLM_PROVIDER:-alibaba_cloud}"
      TENCENT_CLOUD_REGION: "${TENCENT_CLOUD_REGION:-ap-guangzhou}"
      TENCENT_CLOUD_ASR_MODEL: "${TENCENT_CLOUD_ASR_MODEL:-16k_zh}"
      TENCENT_CLOUD_ASR_ENDPOINT: "${TENCENT_CLOUD_ASR_ENDPOINT:-asr.tencentcloudapi.com}"
      TENCENT_CLOUD_REALTIME_ASR_HOST: "${TENCENT_CLOUD_REALTIME_ASR_HOST:-asr.cloud.tencent.com}"
      TENCENT_CLOUD_REALTIME_ASR_ENGINE_MODEL_TYPE: "${TENCENT_CLOUD_REALTIME_ASR_ENGINE_MODEL_TYPE:-16k_zh}"
      TENCENT_CLOUD_REALTIME_ASR_VOICE_FORMAT: "${TENCENT_CLOUD_REALTIME_ASR_VOICE_FORMAT:-1}"
      TENCENT_CLOUD_REALTIME_ASR_FILTER_DIRTY: "${TENCENT_CLOUD_REALTIME_ASR_FILTER_DIRTY:-0}"
      TENCENT_CLOUD_REALTIME_ASR_FILTER_MODAL: "${TENCENT_CLOUD_REALTIME_ASR_FILTER_MODAL:-0}"
      TENCENT_CLOUD_REALTIME_ASR_FILTER_PUNC: "${TENCENT_CLOUD_REALTIME_ASR_FILTER_PUNC:-0}"
      TENCENT_CLOUD_REALTIME_ASR_CONVERT_NUM_MODE: "${TENCENT_CLOUD_REALTIME_ASR_CONVERT_NUM_MODE:-1}"
      TENCENT_CLOUD_TTS_ENDPOINT: "${TENCENT_CLOUD_TTS_ENDPOINT:-tts.tencentcloudapi.com}"
      TENCENT_CLOUD_TTS_VOICE: "${TENCENT_CLOUD_TTS_VOICE:-101001}"
      TENCENT_CLOUD_TTS_CODEC: "${TENCENT_CLOUD_TTS_CODEC:-wav}"
      TENCENT_CLOUD_TTS_SAMPLE_RATE: "${TENCENT_CLOUD_TTS_SAMPLE_RATE:-16000}"
      TENCENT_CLOUD_SECRET_REF: "${TENCENT_CLOUD_SECRET_REF:-env:TENCENT_CLOUD_SECRET_ID,TENCENT_CLOUD_SECRET_KEY}"
      TENCENT_CLOUD_SECRET_FILE: ""
      TENCENT_CLOUD_SECRET_ID: "${TENCENT_CLOUD_SECRET_ID:?set TENCENT_CLOUD_SECRET_ID}"
      TENCENT_CLOUD_SECRET_KEY: "${TENCENT_CLOUD_SECRET_KEY:?set TENCENT_CLOUD_SECRET_KEY}"
      TENCENT_CLOUD_APP_ID: "${TENCENT_CLOUD_APP_ID:-}"
      ALIBABA_CLOUD_REGION: "${ALIBABA_CLOUD_REGION:-cn-hangzhou}"
      ALIBABA_CLOUD_LLM_MODEL: "${ALIBABA_CLOUD_LLM_MODEL:-qwen-plus}"
      ALIBABA_CLOUD_ENDPOINT: "${ALIBABA_CLOUD_ENDPOINT:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      ALIBABA_CLOUD_SECRET_REF: "${ALIBABA_CLOUD_SECRET_REF:-env:ALIBABA_CLOUD_API_KEY}"
      ALIBABA_CLOUD_SECRET_FILE: ""
      ALIBABA_CLOUD_API_KEY: "${ALIBABA_CLOUD_API_KEY:?set ALIBABA_CLOUD_API_KEY}"
      SESSION_PERSIST_AUDIO: "false"
      REPLY_PREPARING_VISIBILITY: "${REPLY_PREPARING_VISIBILITY:-demo_debug_only}"
      ALLOW_TTS_TEXT_ONLY_FALLBACK: "false"
      AUTO_START_VOICE_WORKER: "${AUTO_START_VOICE_WORKER:-true}"
      TURN_LOW_CONFIDENCE_THRESHOLD: "${TURN_LOW_CONFIDENCE_THRESHOLD:-0.72}"
      VOICE_WORKER_LAUNCH_MODE: "external"
      VOICE_WORKER_ID: "${VOICE_WORKER_ID:-prod-worker-1}"
      VOICE_WORKER_POLL_INTERVAL_SECONDS: "${VOICE_WORKER_POLL_INTERVAL_SECONDS:-1.0}"
      VOICE_WORKER_SESSION_POLL_SECONDS: "${VOICE_WORKER_SESSION_POLL_SECONDS:-1.0}"
      VOICE_WORKER_JOB_LEASE_SECONDS: "${VOICE_WORKER_JOB_LEASE_SECONDS:-120}"
      VOICE_WORKER_HEARTBEAT_INTERVAL_SECONDS: "${VOICE_WORKER_HEARTBEAT_INTERVAL_SECONDS:-15.0}"
      VOICE_WORKER_MAX_ATTEMPTS: "${VOICE_WORKER_MAX_ATTEMPTS:-3}"
      TURN_SILENCE_TIMEOUT_SECONDS: "${TURN_SILENCE_TIMEOUT_SECONDS:-12.0}"
      TURN_SILENCE_CHECK_INTERVAL_SECONDS: "${TURN_SILENCE_CHECK_INTERVAL_SECONDS:-1.0}"
      TURN_BARGE_IN_RMS_THRESHOLD: "${TURN_BARGE_IN_RMS_THRESHOLD:-0.018}"
      TURN_BARGE_IN_MIN_VOICE_FRAMES: "${TURN_BARGE_IN_MIN_VOICE_FRAMES:-2}"
      TURN_INTERRUPTION_RECOVERY_TIMEOUT_SECONDS: "${TURN_INTERRUPTION_RECOVERY_TIMEOUT_SECONDS:-2.5}"
    command:
      - "sh"
      - "-c"
      - "python -m backend.app.worker.runtime_config_check && python -m backend.app.worker.voice_worker_runner"
    restart: unless-stopped
